<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>৯ম পে ফিক্সেশন + ধাপভিত্তিক বেতন ২০২৬</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
    --text: #e2e8f0; --muted: #94a3b8; --green: #4ade80;
    --yellow: #fde047; --orange: #fb923c; --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.5; padding: 16px 16px 48px;
  }
  h1 { text-align: center; font-size: 1.25rem; color: var(--accent); margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.84rem; margin-bottom: 16px; }

  .layout {
    display: grid;
    grid-template-columns: minmax(270px, 320px) 1fr;
    gap: 16px;
    max-width: 1000px;
    margin: 0 auto;
    align-items: start;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .card h2 { font-size: 0.92rem; color: var(--accent); margin-bottom: 12px; }

  label {
    display: block; font-size: 0.78rem; color: var(--muted);
    margin-bottom: 4px; font-weight: 600;
  }
  select {
    width: 100%; background: #0f172a; color: var(--text);
    border: 1px solid var(--border); padding: 10px 12px;
    border-radius: 8px; font-size: 0.92rem; margin-bottom: 12px; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  .check-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px; font-size: 0.85rem;
  }
  .check-row input { width: auto; margin: 0; cursor: pointer; }

  .btn {
    width: 100%; background: var(--accent); color: #0f172a;
    border: none; padding: 12px; border-radius: 10px;
    font-size: 0.98rem; font-weight: 800; cursor: pointer;
  }
  .btn:hover { background: #7dd3fc; }

  .hero {
    background: linear-gradient(135deg, #0c4a6e, #164e63);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
    text-align: center;
  }
  .hero .label { font-size: 0.78rem; color: #bae6fd; }
  .hero .value { font-size: 1.85rem; font-weight: 800; color: #fff; }
  .hero .sub { font-size: 0.84rem; color: var(--yellow); margin-top: 4px; }

  .steps-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .step-box {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
  }
  .step-box .n { font-size: 0.68rem; color: var(--muted); margin-bottom: 2px; }
  .step-box .v { font-size: 0.82rem; font-weight: 700; color: var(--accent); }
  .step-box.hl { border-color: var(--green); }
  .step-box.hl .v { color: var(--green); }

  .section { font-size: 0.8rem; font-weight: 700; color: var(--accent); margin: 12px 0 8px; }

  table.tl {
    width: 100%; border-collapse: collapse; font-size: 0.82rem;
  }
  table.tl th {
    text-align: left; padding: 7px 6px; color: var(--muted);
    border-bottom: 1px solid var(--border); font-weight: 600;
  }
  table.tl td {
    padding: 8px 6px; border-bottom: 1px solid var(--border);
  }
  table.tl tr:last-child td { border-bottom: none; }
  table.tl .amt { text-align: right; font-weight: 800; color: var(--green); white-space: nowrap; }
  table.tl .pct { color: var(--yellow); font-weight: 700; }
  table.tl tr.active { background: rgba(56,189,248,0.08); }

  .note {
    font-size: 0.75rem; color: var(--muted); background: #0f172a;
    border-radius: 8px; padding: 10px; margin-top: 12px; line-height: 1.55;
  }
  .note strong { color: var(--yellow); }

  .foot {
    text-align: center; font-size: 0.74rem; color: var(--muted);
    max-width: 1000px; margin: 14px auto 0;
  }
  .error {
    color: #f87171; text-align: center; padding: 20px; font-size: 1rem;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .steps-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<script src="data.js"></script>
<script src="nav.js"></script>

<h1>৯ম পে ফিক্সেশন + ধাপভিত্তিক বেতন</h1>
<p class="subtitle">অনুচ্ছেদ ৫ (ফিক্সেশন) · অনুচ্ছেদ ৯(২) (১ জুলাই ২৬ ইনক্রিমেন্ট) · সারণি-১ বাস্তবায়ন</p>

<div class="layout">
  <div class="card">
    <h2>আপনার অবস্থান (৩০ জুন ২০২৬)</h2>

    <label for="grade">বেতন গ্রেড</label>
    <select id="grade"></select>

    <label for="oldBasic">৩০ জুন ২০২৬ আহরিত মূল বেতন</label>
    <select id="oldBasic"></select>

    <label for="area">কর্মস্থল (বাড়ি ভাড়া · ২০২৮+)</label>
    <select id="area">
      <option value="dhaka">ঢাকা উত্তর / দক্ষিণ সিটি</option>
      <option value="city">নির্ধারিত সিটি / সাভার / কক্সবাজার</option>
      <option value="other">অন্যান্য এলাকা</option>
    </select>

    <label for="age">বয়স (চিকিৎসা)</label>
    <select id="age">
      <option value="under50">৫০ বছর পর্যন্ত</option>
      <option value="over50">৫০+</option>
    </select>

    <div class="check-row">
      <input type="checkbox" id="govHouse">
      <label for="govHouse" style="margin:0;font-weight:500">সরকারি বাসা (বাড়ি ভাড়া নয়)</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="tiffin" checked>
      <label for="tiffin" style="margin:0;font-weight:500">টিফিন (গ্রেড ১১–২০)</label>
    </div>

    <button class="btn" id="calcBtn">হিসাব করুন</button>
  </div>

  <div class="card">
    <div id="resultBody">
      <p style="color:var(--muted);text-align:center;padding:28px 8px">বামদিক থেকে তথ্য দিন</p>
    </div>
  </div>
</div>

<p class="foot">
  চাকরি (বেতন ও ভাতাদি) আদেশ, ২০২৬ · অনুচ্ছেদ ৫ ও ৯ · সারণি-১ ধাপভিত্তিক বাস্তবায়ন ·
  নতুন ভাতার হার সাধারণত ১ জানুয়ারি ২০২৮ থেকে
</p>

<script>
const scales = (window.PayScaleData && window.PayScaleData.full2026) ? window.PayScaleData.full2026 : null;

const allowData = window.AllowanceData || {
  hra2015: [
    { maxBasic: 9700, dhaka: { pct: 65, min: 5600 }, city: { pct: 55, min: 5000 }, other: { pct: 50, min: 4500 } },
    { maxBasic: 16000, dhaka: { pct: 60, min: 6400 }, city: { pct: 50, min: 5400 }, other: { pct: 45, min: 4800 } },
    { maxBasic: 35500, dhaka: { pct: 55, min: 9600 }, city: { pct: 45, min: 8000 }, other: { pct: 40, min: 7000 } },
    { maxBasic: Infinity, dhaka: { pct: 50, min: 19500 }, city: { pct: 40, min: 16000 }, other: { pct: 35, min: 13800 } }
  ],
  hra2026: [
    { minGrade: 16, maxGrade: 20, dhaka: { pct: 60 }, city: { pct: 50 }, other: { pct: 45 } },
    { minGrade: 10, maxGrade: 15, dhaka: { pct: 50 }, city: { pct: 40 }, other: { pct: 35 } },
    { minGrade: 5,  maxGrade: 9,  dhaka: { pct: 45 }, city: { pct: 35 }, other: { pct: 30 } },
    { minGrade: 1,  maxGrade: 4,  dhaka: { pct: 40 }, city: { pct: 30 }, other: { pct: 25 } }
  ]
};

if (!scales) {
  document.getElementById('resultBody').innerHTML =
    '<p class="error">data.js লোড হয়নি। নিশ্চিত করুন data.js একই ফোল্ডারে আছে।</p>';
} else {
  function fmt(n) { return Math.round(n).toLocaleString('en-IN'); }

  // পুরনো স্কেলে ইনক্রিমেন্ট যোগ করে সঠিক বেসিক বের করার ফাংশন
  function getOldBasicAt(steps, currentBasic, incrementsCount) {
    const idx = steps.indexOf(currentBasic);
    if (idx === -1) return currentBasic; // fallback
    return steps[Math.min(idx + incrementsCount, steps.length - 1)];
  }

  function findNextOrExact(amount, steps) {
    for (let i = 0; i < steps.length; i++) {
      if (steps[i] >= amount) return { step: i + 1, pay: steps[i] };
    }
    return { step: steps.length, pay: steps[steps.length - 1] };
  }

  function fixBase(oldBasic, g) {
    const d = scales[g];
    if (oldBasic === d.old[0]) {
      return { step: 1, pay: d.new[0], rule: 'ক', delta: 0, provisional: d.new[0] };
    }
    const delta = oldBasic - d.old[0];
    const provisional = d.new[0] + delta;
    const m = findNextOrExact(provisional, d.new);
    return {
      step: m.step,
      pay: m.pay,
      rule: d.new.includes(provisional) ? 'খ (হুবহু)' : 'খ (পরবর্তী উচ্চতর)',
      delta,
      provisional
    };
  }

  function addIncrement(baseStep, g) {
    const steps = scales[g].new;
    if (baseStep < steps.length) {
      return { step: baseStep + 1, pay: steps[baseStep] };
    }
    return { step: baseStep, pay: steps[baseStep - 1] };
  }

  function phaseList(g) {
    const p1 = g <= 9 ? 40 : 50;
    const p2 = g <= 9 ? 70 : 75;
    return [
      { id: 1, label: '১ম ধাপ (১ জুলাই ২০২৬ - ৩১ ডিসেম্বর ২০২৬)', note: 'ফিক্সেশন ও ১ জুলাই ২৬ ইনক্রিমেন্টসহ', pct: p1, isFull: false, fullAllow: false },
      { id: 2, label: '২য় ধাপ (১ জানুয়ারি ২০২৭ - ৩০ জুন ২০২৭)', note: 'অর্ধেক বাড়তি', pct: p2, isFull: false, fullAllow: false },
      { id: 3, label: '৩য় ধাপ (১ জুলাই ২০২৭ থেকে)', note: '১০০% ও ২০২৭ ইনক্রিমেন্টসহ', pct: 100, isFull: true, fullAllow: false },
      { id: 4, label: '৪র্থ ধাপ (১ জানুয়ারি ২০২৮ থেকে)', note: 'পূর্ণাঙ্গ ও ২০২৭ ইনক্রিমেন্টসহ', pct: 100, isFull: true, fullAllow: true }
    ];
  }

  const gradeSel = document.getElementById('grade');
  const paySel = document.getElementById('oldBasic');
  for (let g = 1; g <= 20; g++) {
    const o = document.createElement('option');
    o.value = g; o.textContent = 'গ্রেড ' + g; gradeSel.appendChild(o);
  }
  const urlG = parseInt(new URLSearchParams(location.search).get('grade'));
  gradeSel.value = (urlG >= 1 && urlG <= 20) ? urlG : 9;

  function fillPay() {
    paySel.innerHTML = '';
    scales[+gradeSel.value].old.forEach((pay, i) => {
      const o = document.createElement('option');
      o.value = pay;
      o.textContent = 'ধাপ ' + (i + 1) + ' — ৳' + fmt(pay);
      paySel.appendChild(o);
    });
  }
  gradeSel.addEventListener('change', () => { fillPay(); calc(); });
  ['oldBasic','area','age','govHouse','tiffin'].forEach(id => {
    document.getElementById(id).addEventListener('change', calc);
  });
  document.getElementById('calcBtn').addEventListener('click', calc);
  fillPay();

  function calc() {
    const g = +gradeSel.value;
    const oldBasic = +paySel.value;
    const area = document.getElementById('area').value;
    const age = document.getElementById('age').value;
    const govHouse = document.getElementById('govHouse').checked;
    const wantTiffin = document.getElementById('tiffin').checked;

    const base = fixBase(oldBasic, g);
    const withInc26 = addIncrement(base.step, g); 
    const targetNew26 = withInc26.pay; // July 2026 fully incremented target

    const withInc27 = addIncrement(withInc26.step, g);
    const targetNew27 = withInc27.pay; // July 2027 fully incremented target

    const fixIncrease = base.pay - oldBasic;
    const fixPct = ((fixIncrease / oldBasic) * 100).toFixed(1);
    const incAmount = targetNew26 - base.pay;
    
    // ** The Magic Fix for Proportional / Loss calculation **
    // 1. Get the natural increments of the OLD scale for proper comparison
    const oldSteps = scales[g].old;
    const oldJul26Basic = getOldBasicAt(oldSteps, oldBasic, 1);
    const oldJul27Basic = getOldBasicAt(oldSteps, oldBasic, 2);

    const oldStart = oldSteps[0];
    const newStart = scales[g].new[0];
    const ratio = newStart / oldStart;

    // 2. Define the TRUE ideal proportional targets (including old increments)
    const idealJul26Full = Math.round(oldJul26Basic * ratio);
    const idealJul27Full = Math.round(oldJul27Basic * ratio);

    const phases = phaseList(g);

    function allowancesFor(payAmt, isOldRates, currentOldBasicRef) {
      if (isOldRates) {
        // Old rules: Use the actual OLD BASIC from that time period for HRA slab
        let slab = allowData.hra2015.find(s => currentOldBasicRef <= s.maxBasic);
        let rawHra = Math.round(currentOldBasicRef * slab[area].pct / 100);
        let finalHra = govHouse ? 0 : Math.max(rawHra, slab[area].min); 
        
        const med = 1500; 
        const tiff = (wantTiffin && g >= 11) ? 200 : 0; 
        return { hra: finalHra, medical: med, tiffin: tiff, total: finalHra + med + tiff };
      } else {
        // New rules: Use the new incremented basic pay
        let slab = allowData.hra2026.find(s => g >= s.minGrade && g <= s.maxGrade);
        let finalHra = govHouse ? 0 : Math.round(payAmt * slab[area].pct / 100);
        
        const med = age === 'under50' ? 3000 : 4000; 
        const tiff = (wantTiffin && g >= 11) ? 500 : 0;
        return { hra: finalHra, medical: med, tiffin: tiff, total: finalHra + med + tiff };
      }
    }

    const stepsHtml =
      '<div class="steps-row">' +
        '<div class="step-box"><div class="n">১ · পুরনো</div><div class="v">৳' + fmt(oldBasic) + '</div></div>' +
        '<div class="step-box"><div class="n">২ · Δ</div><div class="v">' + (base.delta ? fmt(base.delta) : '—') + '</div></div>' +
        '<div class="step-box"><div class="n">৩ · প্রাথমিক</div><div class="v">৳' + fmt(base.provisional || base.pay) + '</div></div>' +
        '<div class="step-box"><div class="n">৪ · অনু·৫ ফিক্স</div><div class="v">৳' + fmt(base.pay) + '</div></div>' +
        '<div class="step-box hl"><div class="n">৫ · অনু·৯(২) +ইনক</div><div class="v">৳' + fmt(targetNew26) + '</div></div>' +
      '</div>';

    function allowLines(alw) {
      let lines = '';
      if (alw.hra > 0) {
        lines += '<div style="color:#fb923c;font-size:0.76rem;font-weight:600">বাড়ি ভাড়া ৳' + fmt(alw.hra) + '</div>';
      } else if (govHouse) {
        lines += '<div style="color:#64748b;font-size:0.76rem">বাড়ি ভাড়া — (সরকারি বাসা)</div>';
      }
      lines += '<div style="color:#fde047;font-size:0.76rem;font-weight:600">চিকিৎসা ৳' + fmt(alw.medical) + '</div>';
      if (alw.tiffin > 0) {
        lines += '<div style="color:#a78bfa;font-size:0.76rem;font-weight:600">টিফিন ৳' + fmt(alw.tiffin) + '</div>';
      }
      return lines;
    }

    const phaseRows = phases.map(p => {
      let pay, idealPhasePay, oldRefBasic;

      if (p.id === 1 || p.id === 2) {
        // Phase 1 & 2: Time is Jul 2026 - Jun 2027. We compare against the Jul 26 Incremented targets.
        pay = oldBasic + Math.round((targetNew26 - oldBasic) * p.pct / 100);
        idealPhasePay = oldBasic + Math.round((idealJul26Full - oldBasic) * p.pct / 100);
        oldRefBasic = oldJul26Basic; // 2015 allowances calculated on the Jul 26 old basic
      } else if (p.id === 3) {
        // Phase 3: Time is Jul 2027 - Dec 2027. New 100% incremented target applied.
        pay = targetNew27;
        idealPhasePay = idealJul27Full; // True proportional comparison includes Jul 27 increment
        oldRefBasic = oldJul27Basic;    // 2015 allowances calculated on the Jul 27 old basic
      } else {
        // Phase 4: Time is Jan 2028+. Allowances become NEW.
        pay = targetNew27; 
        idealPhasePay = idealJul27Full;
        oldRefBasic = oldJul27Basic;    // Unused by new rules, but kept for consistency
      }

      const isOld = !p.fullAllow;
      const alw = allowancesFor(pay, isOld, oldRefBasic);
      const phaseGross = pay + alw.total;

      const ratioAlw = allowancesFor(idealPhasePay, isOld, oldRefBasic);
      const ratioGross = idealPhasePay + ratioAlw.total;
      const lossAmt = idealPhasePay - pay; // Loss in Basic Pay

      const lossHtml = lossAmt > 1
        ? '<div style="color:#38bdf8;font-weight:700">মূল ৳' + fmt(idealPhasePay) + '</div>' +
          '<div style="color:#4ade80;font-size:0.9rem;font-weight:700;margin-top:2px">গ্রস ৳' + fmt(ratioGross) + '</div>' +
          '<div style="color:#f87171;font-size:0.72rem;margin-top:3px;font-weight:700">ক্ষতি −৳' + fmt(lossAmt) + '</div>'
        : '<div style="color:#4ade80;font-size:0.8rem">সমান / বেশি</div>';

      return '<tr class="' + (p.pct === 40 || p.pct === 50 ? 'active' : '') + '">' +
        '<td><strong>' + p.label + '</strong><br><span style="color:var(--muted);font-size:0.75rem">' + p.note + '</span></td>' +
        '<td class="pct">' + p.pct + '%</td>' +
        '<td class="amt">' +
          '<div style="color:#38bdf8;font-weight:700">মূল ৳' + fmt(pay) + '</div>' +
          allowLines(alw) +
          '<div style="color:#4ade80;font-size:0.95rem;font-weight:800;margin-top:3px;border-top:1px solid var(--border);padding-top:3px">গ্রস ৳' + fmt(phaseGross) + '</div>' +
        '</td>' +
        '<td class="amt" style="vertical-align:middle">' + lossHtml + '</td></tr>';
    }).join('');

    let subParts = 'ধাপ ' + withInc26.step + ' · পুরনো ৳' + fmt(oldBasic);
    subParts += '<br>ফিক্সেশন বৃদ্ধি +' + fmt(fixIncrease) + ' (+' + fixPct + '%)';
    if (incAmount > 0) {
      subParts += ' · ইনক্রিমেন্ট +' + fmt(incAmount);
    }

    document.getElementById('resultBody').innerHTML =
      '<div class="hero">' +
        '<div class="label">৯ম স্কেলে কার্যকর পূর্ণ মূল বেতন (ফিক্সেশন + ১ জুলাই ২৬ ইনক্রিমেন্ট)</div>' +
        '<div class="value">৳' + fmt(targetNew26) + '</div>' +
        '<div class="sub">' + subParts + '</div>' +
      '</div>' +

      stepsHtml +

      '<div class="section">ধাপভিত্তিক কার্যকর বেতন (সারণি-১) · মূল + ভাতা = গ্রস</div>' +
      '<table class="tl">' +
        '<tr><th>সময়কাল</th><th>বাড়তির %</th><th style="text-align:right">মূল · ভাতা · গ্রস</th><th style="text-align:right">অনুপাতিক হলে (আদর্শ)<br><span style="font-weight:500;font-size:0.72rem;color:#94a3b8">মূল · গ্রস</span></th></tr>' +
        phaseRows +
      '</table>' +
      '<p style="font-size:0.72rem;color:var(--muted);margin-top:8px;text-align:center">অনুপাতিক আদর্শ = প্রতি বছরের ইনক্রিমেন্টসহ পুরনো বেতন × (নতুন প্রারম্ভিক ÷ পুরনো প্রারম্ভিক)</p>' +

      '<div class="note">' +
        '<strong>এই ক্যালকুলেটরটি কেন সবচেয়ে নির্ভুল?</strong><br>' +
        '• <strong>সঠিক অনুপাতিক ক্ষতি:</strong> অন্যান্য ক্যালকুলেটর অনুপাতিক বেতনের সাথে ২০২৬ ও ২০২৭ এর ইনক্রিমেন্ট যোগ করতে ভুলে যায়, যার ফলে ক্ষতির পরিমাণ কম দেখায়। এই ক্যালকুলেটরে ইনক্রিমেন্টসহ ১০০% সঠিক ক্ষতি হিসাব করা হয়েছে।<br>' +
        '• <strong>ভাতার হিসাব:</strong> গেজেট অনুযায়ী ১-৩ ধাপে ভাতা ২০১৫-এর পুরনো হারেই (সেই সময়ের পুরনো বেসিকের ওপর) দেয়া হয়েছে, এবং পূর্ণ নতুন ভাতা ৪র্থ ধাপ থেকে কার্যকর দেখানো হয়েছে।' +
      '</div>';
  }

  calc();
}
