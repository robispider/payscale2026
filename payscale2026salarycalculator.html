<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>৯ম পে ফিক্সেশন + ধাপভিত্তিক বেতন ২০২৬</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
    --text: #e2e8f0; --muted: #94a3b8; --green: #4ade80;
    --yellow: #fde047; --orange: #fb923c; --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.5; padding: 16px 16px 48px;
  }
  h1 { text-align: center; font-size: 1.25rem; color: var(--accent); margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.84rem; margin-bottom: 16px; }

  .layout {
    display: grid;
    grid-template-columns: minmax(270px, 320px) 1fr;
    gap: 16px;
    max-width: 1000px;
    margin: 0 auto;
    align-items: start;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .card h2 { font-size: 0.92rem; color: var(--accent); margin-bottom: 12px; }

  label {
    display: block; font-size: 0.78rem; color: var(--muted);
    margin-bottom: 4px; font-weight: 600;
  }
  select {
    width: 100%; background: #0f172a; color: var(--text);
    border: 1px solid var(--border); padding: 10px 12px;
    border-radius: 8px; font-size: 0.92rem; margin-bottom: 12px; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  .check-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px; font-size: 0.85rem;
  }
  .check-row input { width: auto; margin: 0; cursor: pointer; }

  .btn {
    width: 100%; background: var(--accent); color: #0f172a;
    border: none; padding: 12px; border-radius: 10px;
    font-size: 0.98rem; font-weight: 800; cursor: pointer;
  }
  .btn:hover { background: #7dd3fc; }

  .hero {
    background: linear-gradient(135deg, #0c4a6e, #164e63);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
    text-align: center;
  }
  .hero .label { font-size: 0.78rem; color: #bae6fd; }
  .hero .value { font-size: 1.85rem; font-weight: 800; color: #fff; }
  .hero .sub { font-size: 0.84rem; color: var(--yellow); margin-top: 4px; }

  .steps-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .step-box {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
  }
  .step-box .n { font-size: 0.68rem; color: var(--muted); margin-bottom: 2px; }
  .step-box .v { font-size: 0.82rem; font-weight: 700; color: var(--accent); }
  .step-box.hl { border-color: var(--green); }
  .step-box.hl .v { color: var(--green); }

  .section { font-size: 0.8rem; font-weight: 700; color: var(--accent); margin: 12px 0 8px; }

  table.tl {
    width: 100%; border-collapse: collapse; font-size: 0.82rem;
  }
  table.tl th {
    text-align: left; padding: 7px 6px; color: var(--muted);
    border-bottom: 1px solid var(--border); font-weight: 600;
  }
  table.tl td {
    padding: 8px 6px; border-bottom: 1px solid var(--border);
  }
  table.tl tr:last-child td { border-bottom: none; }
  table.tl .amt { text-align: right; font-weight: 800; color: var(--green); white-space: nowrap; }
  table.tl .pct { color: var(--yellow); font-weight: 700; }
  table.tl tr.active { background: rgba(56,189,248,0.08); }

  .allow-table {
    width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 4px;
  }
  .allow-table td { padding: 6px 4px; border-bottom: 1px solid var(--border); }
  .allow-table td:last-child { text-align: right; font-weight: 700; color: var(--orange); }
  .allow-table tr.total td { border: none; color: var(--green); font-size: 0.92rem; padding-top: 10px; }

  .note {
    font-size: 0.75rem; color: var(--muted); background: #0f172a;
    border-radius: 8px; padding: 10px; margin-top: 12px; line-height: 1.55;
  }
  .note strong { color: var(--yellow); }

  .foot {
    text-align: center; font-size: 0.74rem; color: var(--muted);
    max-width: 1000px; margin: 14px auto 0;
  }
  .error {
    color: #f87171; text-align: center; padding: 20px; font-size: 1rem;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .steps-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<script src="data.js"></script>
<script src="nav.js"></script>

<h1>৯ম পে ফিক্সেশন + ধাপভিত্তিক বেতন</h1>
<p class="subtitle">অনুচ্ছেদ ৫ (ফিক্সেশন) · অনুচ্ছেদ ৯(২) (১ জুলাই ২৬ ইনক্রিমেন্ট) · সারণি-১ বাস্তবায়ন</p>

<div class="layout">
  <div class="card">
    <h2>আপনার অবস্থান (৩০ জুন ২০২৬)</h2>

    <label for="grade">বেতন গ্রেড</label>
    <select id="grade"></select>

    <label for="oldBasic">৩০ জুন ২০২৬ আহরিত মূল বেতন</label>
    <select id="oldBasic"></select>

    <label for="area">কর্মস্থল (বাড়ি ভাড়া · ২০২৮+)</label>
    <select id="area">
      <option value="dhaka">ঢাকা উত্তর / দক্ষিণ সিটি</option>
      <option value="city">নির্ধারিত সিটি / সাভার / কক্সবাজার</option>
      <option value="other">অন্যান্য এলাকা</option>
    </select>

    <label for="age">বয়স (চিকিৎসা)</label>
    <select id="age">
      <option value="under50">৫০ বছর পর্যন্ত</option>
      <option value="over50">৫০+</option>
    </select>

    <div class="check-row">
      <input type="checkbox" id="govHouse">
      <label for="govHouse" style="margin:0;font-weight:500">সরকারি বাসা (বাড়ি ভাড়া নয়)</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="tiffin" checked>
      <label for="tiffin" style="margin:0;font-weight:500">টিফিন (গ্রেড ১১–২০)</label>
    </div>

    <button class="btn" id="calcBtn">হিসাব করুন</button>
  </div>

  <div class="card">
    <div id="resultBody">
      <p style="color:var(--muted);text-align:center;padding:28px 8px">বামদিক থেকে তথ্য দিন</p>
    </div>
  </div>
</div>

<p class="foot">
  চাকরি (বেতন ও ভাতাদি) আদেশ, ২০২৬ · অনুচ্ছেদ ৫ ও ৯ · সারণি-১ ধাপভিত্তিক বাস্তবায়ন ·
  নতুন ভাতার হার সাধারণত ১ জানুয়ারি ২০২৮ থেকে
</p>

<script>
// data.js থেকে শুধুমাত্র – কোনো ডুপ্লিকেট/ফলব্যাক নেই
const scales = (window.PayScaleData && window.PayScaleData.full2026)
  ? window.PayScaleData.full2026
  : null;

if (!scales) {
  document.getElementById('resultBody').innerHTML =
    '<p class="error">data.js লোড হয়নি। নিশ্চিত করুন data.js একই ফোল্ডারে আছে।</p>';
} else {
  function fmt(n) { return Math.round(n).toLocaleString('en-IN'); }

  function findNextOrExact(amount, steps) {
    for (let i = 0; i < steps.length; i++) {
      if (steps[i] >= amount) return { step: i + 1, pay: steps[i] };
    }
    return { step: steps.length, pay: steps[steps.length - 1] };
  }

  /** অনুচ্ছেদ ৫ — বেস ফিক্সেশন */
  function fixBase(oldBasic, g) {
    const d = scales[g];
    if (oldBasic === d.old[0]) {
      return { step: 1, pay: d.new[0], rule: 'ক', delta: 0, provisional: d.new[0] };
    }
    const delta = oldBasic - d.old[0];
    const provisional = d.new[0] + delta;
    const m = findNextOrExact(provisional, d.new);
    return {
      step: m.step,
      pay: m.pay,
      rule: d.new.includes(provisional) ? 'খ (হুবহু)' : 'খ (পরবর্তী উচ্চতর)',
      delta,
      provisional
    };
  }

  /** অনুচ্ছেদ ৯(২) — ১ জুলাই ২০২৬-এ ১টি বার্ষিক ইনক্রিমেন্ট */
  function addJuly26Increment(baseStep, g) {
    const steps = scales[g].new;
    if (baseStep < steps.length) {
      return { step: baseStep + 1, pay: steps[baseStep] };
    }
    return { step: baseStep, pay: steps[baseStep - 1] };
  }

  function phaseList(g) {
    if (g <= 9) return [
      { id: 1, label: '১ম ধাপ · জুলাই–ডিসেম্বর ২০২৬', note: 'ফিক্সেশন + ১ জুলাই ২৬ ইনক্রিমেন্টসহ', pct: 40 },
      { id: 2, label: '২য় ধাপ · জানুয়ারি–জুন ২০২৭', note: 'অর্ধেক বাড়তি', pct: 70 },
      { id: 3, label: '৩য় ধাপ · জুলাই ২০২৭ থেকে', note: '১০০% মূল বেতন (+ ২০২৭ ইনক্রিমেন্ট)', pct: 100 }
    ];
    return [
      { id: 1, label: '১ম ধাপ · জুলাই–ডিসেম্বর ২০২৬', note: 'ফিক্সেশন + ১ জুলাই ২৬ ইনক্রিমেন্টসহ', pct: 50 },
      { id: 2, label: '২য় ধাপ · জানুয়ারি–জুন ২০২৭', note: 'অর্ধেক বাড়তি', pct: 75 },
      { id: 3, label: '৩য় ধাপ · জুলাই ২০২৭ থেকে', note: '১০০% মূল বেতন (+ ২০২৭ ইনক্রিমেন্ট)', pct: 100 }
    ];
  }

  function hraPercent(grade, area) {
    let band = grade >= 16 ? 0 : grade >= 10 ? 1 : grade >= 5 ? 2 : 3;
    return { dhaka: [60,50,45,40], city: [50,40,35,30], other: [45,35,30,25] }[area][band];
  }

  const gradeSel = document.getElementById('grade');
  const paySel = document.getElementById('oldBasic');
  for (let g = 1; g <= 20; g++) {
    const o = document.createElement('option');
    o.value = g; o.textContent = 'গ্রেড ' + g; gradeSel.appendChild(o);
  }
  const urlG = parseInt(new URLSearchParams(location.search).get('grade'));
  gradeSel.value = (urlG >= 1 && urlG <= 20) ? urlG : 9;

  function fillPay() {
    paySel.innerHTML = '';
    scales[+gradeSel.value].old.forEach((pay, i) => {
      const o = document.createElement('option');
      o.value = pay;
      o.textContent = 'ধাপ ' + (i + 1) + ' — ৳' + fmt(pay);
      paySel.appendChild(o);
    });
  }
  gradeSel.addEventListener('change', () => { fillPay(); calc(); });
  ['oldBasic','area','age','govHouse','tiffin'].forEach(id => {
    document.getElementById(id).addEventListener('change', calc);
  });
  document.getElementById('calcBtn').addEventListener('click', calc);
  fillPay();

  function calc() {
    const g = +gradeSel.value;
    const oldBasic = +paySel.value;
    const area = document.getElementById('area').value;
    const age = document.getElementById('age').value;
    const govHouse = document.getElementById('govHouse').checked;
    const wantTiffin = document.getElementById('tiffin').checked;

    const base = fixBase(oldBasic, g);
    const withInc = addJuly26Increment(base.step, g);
    const effectiveFull = withInc.pay;

    // বৃদ্ধি আলাদা: ফিক্সেশন vs ইনক্রিমেন্ট
    const fixIncrease = base.pay - oldBasic;
    const fixPct = ((fixIncrease / oldBasic) * 100).toFixed(1);
    const incAmount = withInc.pay - base.pay;
    const totalIncrease = effectiveFull - oldBasic;
    const pctUp = ((totalIncrease / oldBasic) * 100).toFixed(1);

    const jul27 = addJuly26Increment(withInc.step, g);
    const phases = phaseList(g);

    const hraPct = hraPercent(g, area);
    const medical = age === 'under50' ? 3000 : 4000;
    const tiffinAmt = (wantTiffin && g >= 11) ? 500 : 0;

    // ভাতা = নতুন হার (পূর্ণ মূল বেতনের উপর) — প্রতিটি ধাপে একই %
    function allowancesFor(basic) {
      const hra = govHouse ? 0 : Math.round(basic * hraPct / 100);
      return { hra, medical, tiffin: tiffinAmt, total: hra + medical + tiffinAmt };
    }

    const fullAllow = allowancesFor(effectiveFull);
    const gross = effectiveFull + fullAllow.total;

    const stepsHtml =
      '<div class="steps-row">' +
        '<div class="step-box"><div class="n">১ · পুরনো</div><div class="v">৳' + fmt(oldBasic) + '</div></div>' +
        '<div class="step-box"><div class="n">২ · Δ</div><div class="v">' + (base.delta ? fmt(base.delta) : '—') + '</div></div>' +
        '<div class="step-box"><div class="n">৩ · প্রাথমিক</div><div class="v">৳' + fmt(base.provisional || base.pay) + '</div></div>' +
        '<div class="step-box"><div class="n">৪ · অনু·৫ ফিক্স</div><div class="v">৳' + fmt(base.pay) + '</div></div>' +
        '<div class="step-box hl"><div class="n">৫ · অনু·৯(২) +ইনক</div><div class="v">৳' + fmt(withInc.pay) + '</div></div>' +
      '</div>';

    // ভাতার নাম + অঙ্ক আলাদা সারিতে (রঙ সামঞ্জস্যপূর্ণ)
    // মূল = accent নীল, বাড়ি ভাড়া = orange, চিকিৎসা = yellow, টিফিন = muted, গ্রস = green
    function allowLines(alw) {
      let lines = '';
      if (alw.hra > 0) {
        lines += '<div style="color:#fb923c;font-size:0.76rem;font-weight:600">বাড়ি ভাড়া ৳' + fmt(alw.hra) + '</div>';
      } else if (govHouse) {
        lines += '<div style="color:#64748b;font-size:0.76rem">বাড়ি ভাড়া — (সরকারি বাসা)</div>';
      }
      lines += '<div style="color:#fde047;font-size:0.76rem;font-weight:600">চিকিৎসা ৳' + fmt(alw.medical) + '</div>';
      if (alw.tiffin > 0) {
        lines += '<div style="color:#a78bfa;font-size:0.76rem;font-weight:600">টিফিন ৳' + fmt(alw.tiffin) + '</div>';
      }
      return lines;
    }

    // প্রতিটি ধাপে: মূল বেতন + প্রতিটি ভাতা = গ্রস
    const phaseRows = phases.map(p => {
      const pay = oldBasic + totalIncrease * p.pct / 100;
      const alw = allowancesFor(pay);
      const phaseGross = pay + alw.total;
      return '<tr class="' + (p.pct === 40 || p.pct === 50 ? 'active' : '') + '">' +
        '<td><strong>' + p.label + '</strong><br><span style="color:var(--muted);font-size:0.75rem">' + p.note + '</span></td>' +
        '<td class="pct">' + p.pct + '%</td>' +
        '<td class="amt">' +
          '<div style="color:#38bdf8;font-weight:700">মূল ৳' + fmt(pay) + '</div>' +
          allowLines(alw) +
          '<div style="color:#4ade80;font-size:0.95rem;font-weight:800;margin-top:3px;border-top:1px solid var(--border);padding-top:3px">গ্রস ৳' + fmt(phaseGross) + '</div>' +
        '</td></tr>';
    }).join('');

    const jul27Pay = jul27.pay;
    const jul27Alw = allowancesFor(jul27Pay);
    const jul27Gross = jul27Pay + jul27Alw.total;
    const jul27Row = '<tr>' +
      '<td><strong>জুলাই ২০২৭+ (ইনক্রিমেন্টসহ আনুমানিক)</strong><br><span style="color:var(--muted);font-size:0.75rem">পূর্ণ স্কেল + ১টি বার্ষিক ধাপ</span></td>' +
      '<td class="pct">—</td>' +
      '<td class="amt">' +
        '<div style="color:#38bdf8;font-weight:700">মূল ৳' + fmt(jul27Pay) + '</div>' +
        allowLines(jul27Alw) +
        '<div style="color:#4ade80;font-size:0.95rem;font-weight:800;margin-top:3px;border-top:1px solid var(--border);padding-top:3px">গ্রস ৳' + fmt(jul27Gross) + '</div>' +
      '</td></tr>';

    // হিরো সাবটাইটেল: শুধু ফিক্সেশন + ইনক্রিমেন্ট (মোট বাদ)
    let subParts = 'ধাপ ' + withInc.step + ' · পুরনো ৳' + fmt(oldBasic);
    subParts += '<br>ফিক্সেশন বৃদ্ধি +' + fmt(fixIncrease) + ' (+' + fixPct + '%)';
    if (incAmount > 0) {
      subParts += ' · ইনক্রিমেন্ট +' + fmt(incAmount);
    }


    document.getElementById('resultBody').innerHTML =
      '<div class="hero">' +
        '<div class="label">৯ম স্কেলে কার্যকর পূর্ণ মূল বেতন (ফিক্সেশন + ১ জুলাই ২৬ ইনক্রিমেন্ট)</div>' +
        '<div class="value">৳' + fmt(effectiveFull) + '</div>' +
        '<div class="sub">' + subParts + '</div>' +
      '</div>' +

      stepsHtml +

      '<div class="section">ধাপভিত্তিক কার্যকর বেতন (সারণি-১) · মূল + ভাতা = গ্রস</div>' +
      '<table class="tl">' +
        '<tr><th>সময়কাল</th><th>বাড়তির %</th><th style="text-align:right">মূল · ভাতা · গ্রস</th></tr>' +
        phaseRows +
        jul27Row +
      '</table>' +

      '<div class="section">নতুন ভাতার বিবরণ · ৩য় ধাপ (১০০% · ৳' + fmt(effectiveFull) + ') · ১ জানুয়ারি ২০২৮+</div>' +
      '<table class="allow-table">' +
        '<tr><td style="color:#38bdf8">মূল বেতন (ফিক্সেশন + জুলাই ২৬ ইনক্রিমেন্ট)</td><td style="color:#38bdf8">৳' + fmt(effectiveFull) + '</td></tr>' +
        '<tr><td style="color:#fb923c">বাড়ি ভাড়া' + (govHouse ? ' (সরকারি বাসা)' : ' (' + hraPct + '%)') + '</td><td style="color:#fb923c">৳' + fmt(fullAllow.hra) + '</td></tr>' +
        '<tr><td style="color:#fde047">চিকিৎসা</td><td style="color:#fde047">৳' + fmt(medical) + '</td></tr>' +
        (tiffinAmt ? '<tr><td style="color:#a78bfa">টিফিন</td><td style="color:#a78bfa">৳' + fmt(tiffinAmt) + '</td></tr>' : '') +
        '<tr class="total"><td style="color:#4ade80">গ্রস (৩য় ধাপ · পূর্ণ স্কেল)</td><td style="color:#4ade80">৳' + fmt(gross) + '</td></tr>' +
      '</table>' +

      '<div class="note">' +
        '<strong>গেজেট টাইমলাইন:</strong><br>' +
        '• <strong>অনুচ্ছেদ ৫:</strong> বেস ফিক্সেশন → ৳' + fmt(base.pay) + ' (ধাপ ' + base.step + ', নিয়ম ' + base.rule + ') · বৃদ্ধি +' + fmt(fixIncrease) + ' (+' + fixPct + '%)<br>' +
        '• <strong>অনুচ্ছেদ ৯(২):</strong> ১ জুলাই ২০২৬-এ ১টি বার্ষিক ইনক্রিমেন্ট → ৳' + fmt(withInc.pay) + ' (ধাপ ' + withInc.step + ')' +
          (incAmount > 0 ? ' · ইনক্রিমেন্ট +' + fmt(incAmount) : ' · ইনক্রিমেন্ট নেই (সর্বোচ্চ ধাপ)') + '<br>' +
        '• ধাপভিত্তিক % হিসাব হয় এই <strong>ইনক্রিমেন্টসহ</strong> পূর্ণ মূল বেতনের বাড়তির উপর<br>' +
        '• উপরের ভাতা <strong>নতুন হারে</strong> দেখানো (১ জানুয়ারি ২০২৮+) · জুলাই ২৬–ডিসেম্বর ২৭ ভাতা সাধারণত পুরনো হারে থাকবে' +
      '</div>';
  }

  calc();
}
</script>
