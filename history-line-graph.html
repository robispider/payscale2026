<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পে-স্কেলভিত্তিক ঐতিহাসিক বৃদ্ধি</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
    --text: #e2e8f0; --muted: #94a3b8; --border: #334155; --yellow: #fde047;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.5; padding: 16px 16px 40px;
  }
  h1 { text-align: center; font-size: 1.3rem; color: var(--accent); margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 16px; font-size: 0.88rem; }

  .controls {
    display: flex; justify-content: center; gap: 10px; margin-bottom: 12px;
    flex-wrap: wrap; align-items: center;
  }
  button, select {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; font-weight: 600;
  }
  button:hover, select:hover { border-color: var(--accent); color: var(--accent); }
  select { min-width: 140px; }
  .mode-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
    max-width: 1100px; margin: 0 auto 12px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px; background: var(--card);
    border: 1px solid var(--border); padding: 4px 10px; border-radius: 18px;
    cursor: pointer; font-size: 0.8rem; font-weight: 600; user-select: none;
  }
  .legend-item:hover { border-color: var(--accent); }
  .legend-item.off { opacity: 0.35; text-decoration: line-through; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .chart-box {
    max-width: 1100px; margin: 0 auto 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  }
  canvas { width: 100% !important; max-height: 460px; }

  .info {
    text-align: center; font-size: 0.82rem; color: var(--muted);
    max-width: 900px; margin: 0 auto;
  }
  .info strong { color: var(--yellow); }
</style>
</head>
<body>

<!-- nav.js automatically injects the menu here -->

<h1>পে-স্কেলভিত্তিক ঐতিহাসিক বৃদ্ধি</h1>
<p class="subtitle">প্রতিটি লাইন = একটি পে-স্কেল · নরমালাইজড %</p>

<div class="controls">
  <span class="mode-label">মোড:</span>
  <select id="normMode">
    <option value="fixed">ফিক্সড বেস (একটি স্কেল = ১০০)</option>
    <option value="previous">আগের স্কেল = পরের বেস (ক্রমবৃদ্ধি)</option>
  </select>

  <span class="mode-label" id="baseLabel">বেস স্কেল:</span>
  <select id="baseYear"></select>

  <button id="showAll">সব দেখান</button>
  <button id="hideAll">সব লুকান</button>
  <button id="onlyRecent">২০০৯–২০২৬</button>
</div>

<div class="legend" id="legend"></div>

<div class="chart-box">
  <canvas id="chart"></canvas>
</div>

<p class="info">
  <strong>ফিক্সড বেস:</strong> নির্বাচিত স্কেলকে ১০০ ধরে অন্য স্কেলগুলো কত %।  
  <strong>আগের স্কেল বেস:</strong> প্রতিটি স্কেল তার আগের স্কেলের তুলনায় কত % বেড়েছে।
</p>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  if (!window.PayScaleData) {
    document.body.insertAdjacentHTML('afterbegin',
      '<p style="color:#f87171;text-align:center;padding:20px">data.js লোড হয়নি। ফাইল একই ফোল্ডারে আছে কিনা চেক করুন।</p>');
    return;
  }

  const historical = window.PayScaleData.starts;
  const years = window.PayScaleData.years;
  const colors = ['#94a3b8','#64748b','#0ea5e9','#8b5cf6','#ec4899','#f59e0b','#10b981','#38bdf8','#fde047'];
  const grades = Array.from({length:20}, (_,i) => i+1);

  const baseSelect = document.getElementById('baseYear');
  years.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    if (y === 1973) opt.selected = true;
    baseSelect.appendChild(opt);
  });

  function getBaseValue(grade, baseYear) {
    const data = historical[baseYear];
    if (!data) return null;
    if (data[grade]) return data[grade];
    for (let d = 1; d <= 5; d++) {
      if (data[grade - d]) return data[grade - d];
      if (data[grade + d]) return data[grade + d];
    }
    return null;
  }

  function buildDatasets(mode, baseYear) {
    if (mode === 'fixed') {
      return years.map((year, idx) => {
        const data = grades.map(g => {
          const val = historical[year][g];
          const base = getBaseValue(g, baseYear);
          if (val == null || base == null) return null;
          return (val / base) * 100;
        });
        return {
          label: String(year), data,
          borderColor: colors[idx], backgroundColor: colors[idx],
          borderWidth: year === 2026 ? 3.5 : 2.2,
          pointRadius: year === 2026 ? 4 : 2.5, pointHoverRadius: 6,
          tension: 0.25, spanGaps: true, hidden: false
        };
      });
    }
    // previous-as-base
    return years.map((year, idx) => {
      const data = grades.map(g => {
        if (idx === 0) return historical[year][g] != null ? 100 : null;
        const val = historical[year][g];
        const prev = getBaseValue(g, years[idx - 1]);
        if (val == null || prev == null) return null;
        return (val / prev) * 100;
      });
      return {
        label: String(year), data,
        borderColor: colors[idx], backgroundColor: colors[idx],
        borderWidth: year === 2026 ? 3.5 : 2.2,
        pointRadius: year === 2026 ? 4 : 2.5, pointHoverRadius: 6,
        tension: 0.25, spanGaps: true, hidden: false
      };
    });
  }

  const ctx = document.getElementById('chart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: { labels: grades.map(g => 'গ্রেড ' + g), datasets: buildDatasets('fixed', 1973) },
    options: {
      responsive: true, maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e293b', titleColor: '#38bdf8', bodyColor: '#e2e8f0',
          borderColor: '#334155', borderWidth: 1, padding: 10,
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              return v == null ? ctx.dataset.label + ': —' : ctx.dataset.label + ': ' + v.toFixed(0) + '%';
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#94a3b8', maxRotation: 45, minRotation: 45, font: { size: 11 } }, grid: { color: '#1e293b' } },
        y: {
          type: 'logarithmic',
          ticks: { color: '#94a3b8', callback: v => v + '%' },
          grid: { color: '#1e293b' },
          title: { display: true, text: 'নরমালাইজড (%)', color: '#94a3b8' }
        }
      }
    }
  });

  function rebuildLegend() {
    const legendEl = document.getElementById('legend');
    legendEl.innerHTML = '';
    years.forEach((year, idx) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${colors[idx]}"></div> ${year}`;
      item.addEventListener('click', () => {
        const meta = chart.getDatasetMeta(idx);
        meta.hidden = !meta.hidden;
        item.classList.toggle('off', meta.hidden);
        chart.update();
      });
      legendEl.appendChild(item);
    });
  }
  rebuildLegend();

  function refresh() {
    const mode = document.getElementById('normMode').value;
    const baseYear = +document.getElementById('baseYear').value;
    chart.data.datasets = buildDatasets(mode, baseYear);
    chart.data.datasets.forEach((_, i) => { chart.getDatasetMeta(i).hidden = false; });
    document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('off'));
    chart.options.scales.y.title.text = mode === 'fixed'
      ? baseYear + ' = ১০০ ভিত্তিক (%)'
      : 'আগের স্কেল = ১০০ (ক্রমবৃদ্ধি %)';
    chart.update();
    document.getElementById('baseLabel').style.display = mode === 'fixed' ? '' : 'none';
    document.getElementById('baseYear').style.display = mode === 'fixed' ? '' : 'none';
  }

  document.getElementById('normMode').addEventListener('change', refresh);
  document.getElementById('baseYear').addEventListener('change', refresh);

  document.getElementById('showAll').onclick = () => {
    chart.data.datasets.forEach((_, i) => chart.getDatasetMeta(i).hidden = false);
    document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('off'));
    chart.update();
  };
  document.getElementById('hideAll').onclick = () => {
    chart.data.datasets.forEach((_, i) => chart.getDatasetMeta(i).hidden = true);
    document.querySelectorAll('.legend-item').forEach(el => el.classList.add('off'));
    chart.update();
  };
  document.getElementById('onlyRecent').onclick = () => {
    const recent = [2009, 2015, 2026];
    years.forEach((y, i) => {
      const hide = !recent.includes(y);
      chart.getDatasetMeta(i).hidden = hide;
      document.querySelectorAll('.legend-item')[i].classList.toggle('off', hide);
    });
    chart.update();
  };
})();
</script>
</body>
</html>
